packages:
  - admin
  - support/packages/design-tokens
  - support/generated/api-client
  - support/packages/content-schema
  - support/packages/ui
  - support/packages/screens
  - support/tests/e2e
  - support/design/prototypes
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.108.3"
  - "@tanstack/react-query@5.108.3"
  - lucide-react@1.78.0
# Install scripts are denied by default; these ship prebuilt binaries and do not need theirs.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
# Build-time dependencies of style-dictionary, lifted to patched majors (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249).
# Remove once style-dictionary depends on them itself.
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1

# Local development only. Ports bind to loopback; the passwords are not secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: news_owner, POSTGRES_PASSWORD: local-dev-only, POSTGRES_DB: news }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      { test: ["CMD-SHELL", "pg_isready -U news_owner -d news"], interval: 2s, timeout: 3s, retries: 30 }
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30 }
volumes: { pg: {} }

# Local development only. Ports bind to loopback; the passwords are not secrets.
# `docker compose up -d --wait` starts what every task needs. Start more only when you need it:
#   --profile mail           Mailpit: catches every email      http://127.0.0.1:8025
#   --profile storage        SeaweedFS: S3 with real multipart http://127.0.0.1:8333
#   --profile search         OpenSearch                        http://127.0.0.1:9200
#   --profile analytics      ClickHouse                        http://127.0.0.1:8123
#   --profile observability  OpenTelemetry collector (OTLP)    http://127.0.0.1:4318
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: news_owner, POSTGRES_PASSWORD: local-dev-only, POSTGRES_DB: news }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      { test: ["CMD-SHELL", "pg_isready -U news_owner -d news"], interval: 2s, timeout: 3s, retries: 30 }
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30 }
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [mail]
    environment: { MP_SMTP_AUTH_ACCEPT_ANY: "1", MP_SMTP_AUTH_ALLOW_INSECURE: "1" }
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 2s, timeout: 3s, retries: 30 }
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    profiles: [storage]
    command:
      [
        "server",
        "-dir=/data",
        "-ip.bind=0.0.0.0",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-master.volumeSizeLimitMB=256",
      ]
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3:/data", "./support/infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"]
    healthcheck:
      {
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status"],
        interval: 3s,
        timeout: 3s,
        retries: 30,
      }
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Codespace disks are small and often over 90% full; locally, do not refuse shards for that.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["os:/usr/share/opensearch/data"]
    healthcheck:
      {
        test:
          ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s'"],
        interval: 5s,
        timeout: 5s,
        retries: 40,
      }
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.41.14-alpine # LTS
    profiles: [analytics]
    environment: { CLICKHOUSE_DB: news, CLICKHOUSE_USER: news, CLICKHOUSE_PASSWORD: local-dev-only }
    ports: ["127.0.0.1:8123:8123"]
    volumes: ["ch:/var/lib/clickhouse"]
    ulimits: { nofile: 262144 }
    healthcheck:
      { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"], interval: 3s, timeout: 3s, retries: 30 }
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [observability]
    user: "0"
    volumes:
      ["./support/infra/local/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro", "traces:/traces"]
    ports: ["127.0.0.1:4318:4318"]
volumes: { pg: {}, s3: {}, os: {}, ch: {}, traces: {} }

# Local only. Traces go to the log and to a file that support/scripts/verify-otel.sh reads.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
exporters:
  debug: {}
  file: { path: /traces/traces.json, flush_interval: 200ms }
service:
  pipelines:
    traces: { receivers: [otlp], exporters: [debug, file] }

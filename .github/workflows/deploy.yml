name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }
  deploy:
    needs: ci
    # Nothing to deploy to until infra/terraform/bootstrap has been applied and the variables set.
    if: vars.AWS_DEPLOY_READY == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://${{ vars.ADMIN_HOST }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/news-${{ inputs.environment || 'staging' }}
      TAG: ${{ github.sha }}
      SUBNETS: ${{ vars.APP_SUBNETS }}
      SECURITY_GROUP: ${{ vars.APP_SECURITY_GROUP }}
      API_HOST: ${{ vars.API_HOST }}
      ADMIN_HOST: ${{ vars.ADMIN_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          {
            context: apps/api,
            push: true,
            provenance: true,
            sbom: true,
            tags: "${{ env.REGISTRY }}/api:${{ env.TAG }}",
          }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          {
            context: .,
            file: apps/admin/Dockerfile,
            push: true,
            provenance: true,
            sbom: true,
            tags: "${{ env.REGISTRY }}/admin:${{ env.TAG }}",
          }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          {
            context: infra/docker/pgbouncer,
            push: true,
            provenance: true,
            sbom: true,
            tags: "${{ env.REGISTRY }}/pgbouncer:${{ env.TAG }}",
          }
      - run: ./scripts/deploy.sh

# The device jobs N times side by side, on separate runners, to prove they are stable (ADR-0048) or to catch a fault
# with its evidence. Every run keeps its evidence. Started by hand (Actions → Soak → Run workflow), or by a push to a
# soak/* branch while a fault is being found.
name: Soak
on:
  workflow_dispatch:
    inputs:
      runs: { description: How many runs of each, type: number, default: 10 }
      android: { type: boolean, default: true }
      ios: { type: boolean, default: true }
      emulator-options: { description: Extra emulator options, type: string, default: "" }
  push:
    branches: ["soak/**"]
permissions:
  contents: read
concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - id: runs
        run: echo "runs=$(python3 -c 'import json, sys; print(json.dumps([str(i) for i in range(1, int(sys.argv[1]) + 1)]))' '${{ inputs.runs || 8 }}')" >> "$GITHUB_OUTPUT"
  device:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        # Diagnosis only (this branch). The fault: SwiftShader on the host (gfxstream's RenderThread) crashes.
        config:
          - { name: host-impeller, gpu: swiftshader_indirect, target: google_apis, flags: "" }
          - { name: guest-gpu, gpu: guest, target: google_apis, flags: "" }
          - { name: host-skia, gpu: swiftshader_indirect, target: google_apis, flags: "--no-enable-impeller" }
          - { name: atd-impeller, gpu: swiftshader_indirect, target: google_atd, flags: "" }
    uses: ./.github/workflows/mobile-device.yml
    with:
      run: ${{ matrix.config.name }}-${{ matrix.run }}
      android: true
      ios: false
      emulator-options: "-feature -Vulkan"
      emulator-gpu: ${{ matrix.config.gpu }}
      emulator-target: ${{ matrix.config.target }}
      engine-flags: ${{ matrix.config.flags }}
      emulator-cores: "3"
      keep-evidence: true
  result:
    if: always()
    needs: device
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "### Soak: ${{ needs.device.result }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.device.result }}" = success

name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  API_SURFACE: admin
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services: &services
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: news_owner, POSTGRES_PASSWORD: local-dev-only, POSTGRES_DB: news }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U news_owner" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9" }
      - name: FFmpeg (the local transcoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff format --check . && uv run ruff check . --exclude '*/migrations/*'
      - run: uv run mypy newsplatform config
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (coverage gate 85%)
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=85
      - name: Tracing works end to end
        run: ../support/scripts/verify-otel.sh
      - run: uv run bandit -q -r newsplatform config -ll
      - run: uv run pip-audit --progress-spinner off
      - name: OpenAPI is current
        run: |
          for s in admin public; do
            API_SURFACE=$s uv run python manage.py spectacular --format openapi-json --file ../support/docs/api/openapi-$s.json --validate --fail-on-warn
          done
          git diff --exit-code -- ../support/docs/api
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @news/design-tokens build
      - name: Generated code is current
        run: |
          pnpm --filter @news/api-client generate
          pnpm --filter @news/content-schema generate
          node support/scripts/i18n-review.mjs
          git diff --exit-code -- support/generated/api-client/src/generated support/packages/design-tokens/dart support/packages/content-schema/src/generated backend/newsplatform/content/schema backend/newsplatform/site_config/theme support/docs/i18n
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services: *services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9" }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - name: FFmpeg and storage (the local media pipeline)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          docker compose --profile storage up -d --wait seaweedfs
      - run: pnpm --filter @news/admin... build
        env: { API_PROXY_TARGET: "http://127.0.0.1:8001", REALTIME_PROXY_TARGET: "http://127.0.0.1:8002" }
      - run: pnpm --filter @news/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @news/e2e e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright, path: "support/tests/e2e/playwright-report", retention-days: 7 }
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: flutter
        run: echo "version=$(jq -r .flutter mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.flutter.outputs.version }}", channel: stable, cache: true }
      - run: flutter pub get && dart analyze --fatal-infos && flutter test
        working-directory: support/packages/design-tokens/dart
      - name: Content models are current and pass every fixture
        working-directory: support/packages/content-schema/dart
        run: |
          node ../scripts/generate.mjs
          dart pub get
          dart format lib > /dev/null
          git diff --exit-code -- lib
          dart analyze --fatal-infos
          dart test
      - name: Dart client is current and valid
        run: |
          support/scripts/generate-dart-client.sh
          git diff --exit-code -- support/generated/api-client-dart/lib
          cd support/generated/api-client-dart && dart analyze
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "21" }
      - id: flutter
        run: echo "version=$(jq -r .flutter mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.flutter.outputs.version }}", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - name: Generated code is current
        run: |
          node ../support/packages/i18n/generate.mjs
          flutter gen-l10n
          dart run build_runner build
          dart format lib > /dev/null
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: dart analyze --fatal-infos
      - name: Unit, widget and golden tests
        run: flutter test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: golden-failures, path: "mobile/test/**/failures", retention-days: 7 }
      - name: App bundle and an APK per processor
        run: |
          flutter build appbundle --release --flavor prod --dart-define-from-file=config/prod.json --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --flavor prod --split-per-abi --dart-define-from-file=config/prod.json --obfuscate --split-debug-info=build/symbols
      - name: Under 30 MB each
        run: |
          for f in build/app/outputs/flutter-apk/app-*-prod-release.apk; do
            size=$(stat -c %s "$f"); echo "$(basename "$f") $((size / 1048576)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$size" -lt $((30 * 1048576))
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          {
            name: android,
            path: "mobile/build/app/outputs/flutter-apk/*-prod-release.apk",
            retention-days: 7,
          }
  mobile-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services: *services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "21" }
      - id: flutter
        run: echo "version=$(jq -r .flutter mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.flutter.outputs.version }}", channel: stable, cache: true }
      - name: The API, filled by the demo seed
        working-directory: backend
        env:
          {
            ALLOWED_HOSTS: "localhost,127.0.0.1,10.0.2.2",
            STORAGE_ENDPOINT_URL: "http://127.0.0.1:8333",
            LOCAL_TRANSCODER: "1",
            LOCAL_SCANNER: "eicar",
            AWS_ACCESS_KEY_ID: test,
            AWS_SECRET_ACCESS_KEY: test,
          }
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          (cd .. && docker compose --profile storage up -d --wait seaweedfs)
          uv sync --locked
          uv run python manage.py migrate -v0
          uv run python manage.py seed_demo --posts=60 --images=8 --videos=2
          uv run python manage.py shell -v0 -c "
          from newsplatform.site_config.models import SettingsSection as S
          S.objects.update_or_create(key='app', defaults={'data': {'min_android': '0.1.0', 'store_android': 'https://example.com'}})
          b = S.objects.get(key='brand'); b.data['appearance'] = {'theme': 'bold'}; b.save()"
          API_SURFACE=public nohup uv run uvicorn config.asgi:application --port 8010 --log-level warning > /tmp/api.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8010/health/live > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8010/api/v1/app-config | head -c 200
      - name: Virtualisation for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json --timeout 8m
  mobile-ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: flutter
        run: echo "version=$(jq -r .flutter mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.flutter.outputs.version }}", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - name: A release that only lacks a signature
        run: |
          flutter build ios --release --no-codesign --flavor prod --dart-define-from-file=config/prod.json --obfuscate --split-debug-info=build/symbols
          du -sh build/ios/iphoneos/*.app | tee -a "$GITHUB_STEP_SUMMARY"
      - name: On a simulator, against the recorded API
        run: |
          node ../support/tests/replay.mjs 8010 &
          device=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device" && xcrun simctl bootstatus "$device" -b
          flutter test integration_test -d "$device" --flavor dev --dart-define-from-file=config/dev-ios.json --timeout 10m
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.17.2" }
      - run: terraform fmt -check -recursive support/infra/terraform
      - run: |
          for d in bootstrap envs/dev envs/staging envs/prod; do
            terraform -chdir=support/infra/terraform/$d init -backend=false -input=false -lockfile=readonly
            terraform -chdir=support/infra/terraform/$d validate
          done
      - run: terraform -chdir=support/infra/terraform/modules/platform init -backend=false -input=false && terraform -chdir=support/infra/terraform/modules/platform test
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile }
          - { name: admin, context: ., file: admin/Dockerfile }
          - {
              name: pgbouncer,
              context: support/infra/docker/pgbouncer,
              file: support/infra/docker/pgbouncer/Dockerfile,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          {
            context: "${{ matrix.context }}",
            file: "${{ matrix.file }}",
            load: true,
            tags: "scan:${{ matrix.name }}",
          }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          {
            image-ref: "scan:${{ matrix.name }}",
            severity: "HIGH,CRITICAL",
            ignore-unfixed: true,
            exit-code: "1",
          }
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --no-banner
      - name: Static analysis (Semgrep)
        run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d semgrep scan --error --severity ERROR --metrics off --config p/python --config p/django --config p/typescript --config p/react --config p/github-actions
      - name: Known vulnerabilities (OSV)
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde scan source --lockfile /src/backend/uv.lock --lockfile /src/pnpm-lock.yaml
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: support/infra, severity: "HIGH,CRITICAL", exit-code: "1" }
  required:
    if: always()
    needs: [api, web, e2e, dart, mobile, mobile-android, mobile-ios, infra, images, security]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

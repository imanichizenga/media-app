version: 2
updates:
  - {
      package-ecosystem: uv,
      directory: /apps/api,
      schedule: { interval: weekly },
      cooldown: { default-days: 7 },
    }
  - { package-ecosystem: npm, directory: /, schedule: { interval: weekly }, cooldown: { default-days: 7 } }
  - {
      package-ecosystem: github-actions,
      directory: /,
      schedule: { interval: weekly },
      cooldown: { default-days: 7 },
    }
  - { package-ecosystem: terraform, directories: ["/infra/terraform/**"], schedule: { interval: weekly } }
  - { package-ecosystem: docker, directories: ["/apps/*", "/infra/docker/*"], schedule: { interval: weekly } }
